name: iOS release build (GitHub macOS runner)

# Builds the iOS app with `eas build --local` on GitHub's own macOS machine. The Expo Free plan has no cloud iOS
# builds left until 2026-11-01, and local builds do not use that quota. Signing certificates and the provisioning
# profile are fetched from EAS with the EXPO_TOKEN repository secret. Runs only for pushes to the release branch.
# The IPA is kept for one day as a workflow artifact and is uploaded to App Store Connect from the owner's machine.
on:
  push:
    branches: ['ios/release-2.0.3-20261023']
  workflow_dispatch:

concurrency:
  group: ios-release-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check that the Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is missing (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the newest Xcode 26 when the runner has several
        run: |
          ls -d /Applications/Xcode_*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - run: npm ci

      - name: Clean up the Expo token and report its length
        env:
          RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RAW_EXPO_TOKEN" | tr -d '[:space:]"')
          echo "::add-mask::$TOKEN"
          echo "EXPO_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "::notice title=EXPO_TOKEN length::raw ${#RAW_EXPO_TOKEN} characters, after cleaning ${#TOKEN} (a real Expo token has 40)"

      - name: Check who the Expo token belongs to
        run: |
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest --version

      - name: Build the IPA
        run: |
          set -o pipefail
          DEBUG='eas:*' npx --yes eas-cli@latest build --platform ios --profile testflight --local --non-interactive --output "$RUNNER_TEMP/akhoo.ipa" 2>&1 | tee "$RUNNER_TEMP/eas-build.log"

      - name: Show the end of the build log when the build failed
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/eas-build.log" ]; then
            grep -i -E 'graphql|error|fail|denied|forbidden|plan|quota|limit' "$RUNNER_TEMP/eas-build.log" | grep -v -i -E 'token|password|secret|deprecated' | tail -n 30 > "$RUNNER_TEMP/errors.txt" || true
            echo "::error title=EAS errors::$(awk '{printf "%s%%0A", $0}' "$RUNNER_TEMP/errors.txt" | cut -c1-3500)"
            tail -n 40 "$RUNNER_TEMP/eas-build.log" | grep -v -i -E 'token|password|secret' | sed 's/%/%25/g; s/\r//g' > "$RUNNER_TEMP/tail.txt"
            split -l 12 "$RUNNER_TEMP/tail.txt" "$RUNNER_TEMP/chunk_"
            for part in "$RUNNER_TEMP"/chunk_*; do
              echo "::error title=EAS build log::$(awk '{printf "%s%%0A", $0}' "$part")"
            done
          fi

      - name: Show the IPA
        run: ls -la "$RUNNER_TEMP/akhoo.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: akhoo-ios-ipa
          path: ${{ runner.temp }}/akhoo.ipa
          retention-days: 1
          if-no-files-found: error
